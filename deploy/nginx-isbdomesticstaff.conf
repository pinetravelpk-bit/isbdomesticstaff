# nginx server block for isbdomesticstaff.pk (static site)
# Installed to /etc/nginx/sites-available/isbdomesticstaff.pk by deploy/setup.sh.
# certbot adds the HTTPS (443) block and the http->https redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name isbdomesticstaff.pk www.isbdomesticstaff.pk;

    root /var/www/isbdomesticstaff;
    index index.html;

    # never serve the git folder or deploy scripts
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # HTML always revalidated so edits show immediately (assets set their own header)
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
